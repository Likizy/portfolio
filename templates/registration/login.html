{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-3">Sign in</h4>

                    {% if form.errors %}
                        <div class="alert alert-danger py-2">Invalid username or password.</div>
                    {% endif %}

                    {% if next %}
                        {% if user.is_authenticated %}
                            <div class="alert alert-warning py-2">Your account does not have access to this page.</div>
                        {% endif %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label" for="id_username">Username</label>
                            <input class="form-control" id="id_username" name="username" type="text" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="id_password">Password</label>
                            <input class="form-control" id="id_password" name="password" type="password" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Login</button>
                        <input type="hidden" name="next" value="{{ next }}">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
